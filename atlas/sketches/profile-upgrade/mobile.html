<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>Profile — Atlas Path (Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #0c1a1a;
      --color-surface: #142424;
      --color-surface-elevated: #1a2e2e;
      --color-border: #243838;
      --color-text: #e8e4df;
      --color-text-muted: #9ba8a8;
      --color-text-dim: #8a9a9a;
      --color-accent: #c87a5a;
      --color-accent-bright: #d88a6a;
      --color-success: #6ba890;
      --color-danger: #d4704c;
      --radius-card: 12px;
      --radius-button: 8px;
      --radius-element: 4px;
      --radius-pill: 999px;
      --fs-h2: 24px;
      --fs-h3: 20px;
      --fs-h3-sm: 18px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --nav-height: 52px;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* ── Main nav (compact for mockup) ── */
    .main-nav {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      font-family: var(--font-mono); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .main-nav-inner {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; height: var(--nav-height);
      overflow-x: auto;
    }
    .main-nav-link {
      background: none; border: none; cursor: pointer;
      color: var(--color-text-dim); white-space: nowrap;
      border-bottom: 1px solid transparent;
      padding: 6px 0; min-height: 32px;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
    }
    .main-nav-link.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }
    .main-nav-spacer { flex: 1; min-width: 8px; }
    .main-nav-user {
      background: none; border: none; cursor: pointer;
      color: var(--color-accent); font: inherit;
      padding: 6px 0; white-space: nowrap;
    }

    /* ── Page ── */
    .page { padding: 20px 16px 80px; }

    .section-title { font: 400 var(--fs-h2)/1.2 var(--font-serif); margin-bottom: 6px; }
    .section-desc { font-size: 13px; color: var(--color-text-muted); line-height: 1.5; margin-bottom: 20px; }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .card-header h3 { font: 400 var(--fs-h3)/1.2 var(--font-serif); font-size: 18px; }

    .edit-btn {
      background: none; border: 1px solid var(--color-border);
      border-radius: var(--radius-button);
      color: var(--color-text-dim);
      font: 9px var(--font-mono); letter-spacing: 0.08em;
      text-transform: uppercase; padding: 4px 10px; cursor: pointer;
    }

    .label {
      font: 9px var(--font-mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--color-text-dim);
      margin-bottom: 3px;
    }
    .value { font-size: 13px; color: var(--color-text); }

    .tag {
      display: inline-flex; align-items: center;
      padding: 3px 7px;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-element);
      font: 10px var(--font-sans);
      color: var(--color-text-muted);
    }

    .chip {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      font: 11px var(--font-sans);
      color: var(--color-text);
    }
    .chip.selected { border-color: var(--color-accent); color: var(--color-accent-bright); }

    .role-item {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-element);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .role-item:last-child { margin-bottom: 0; }
    .role-title-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .role-title { font: 500 13px var(--font-sans); }
    .role-org { font-size: 11px; color: var(--color-text-muted); }
    .role-years { font: 10px var(--font-mono); color: var(--color-text-dim); }
    .role-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; }

    hr { border: 0; border-top: 1px solid var(--color-border); margin: 14px 0; }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 6px 0 8px;
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
    }
    .bottom-nav-item {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 4px 6px;
      color: var(--color-text-dim);
      font: 8px var(--font-mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .bottom-nav-item .bn-icon { font-size: 16px; line-height: 1; }
    .bottom-nav-item.active { color: var(--color-accent); }

    .identity-row { display: flex; gap: 14px; align-items: center; }
    .sigil-small {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid var(--color-accent); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; color: var(--color-text-dim);
    }
  </style>
</head>
<body style="max-width: 375px; margin: 0 auto;">

<nav class="main-nav">
  <div class="main-nav-inner">
    <button class="main-nav-link">What matters</button>
    <button class="main-nav-link active">Career</button>
    <button class="main-nav-link">Docs</button>
    <div class="main-nav-spacer"></div>
    <button class="main-nav-user">Rui</button>
  </div>
</nav>

<main class="page">

  <!-- Identity panel shown -->
  <h2 class="section-title">Identity</h2>
  <p class="section-desc">Who you are on Atlas Path.</p>

  <div class="card">
    <div class="identity-row">
      <div class="sigil-small">✦✦</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font:400 17px/1.2 var(--font-serif)">Rui Silva</div>
            <div style="font:11px var(--font-mono);color:var(--color-text-dim)">rui@ruisilvastudio.com</div>
          </div>
          <button class="edit-btn">Edit</button>
        </div>
        <div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap">
          <div><div class="label">Member since</div><div style="font-size:12px;color:var(--color-text-muted)">March 2026</div></div>
          <div><div class="label">Baseline</div><div style="font-size:12px;color:var(--color-success)">✓ Complete</div></div>
          <div><div class="label">Pulses</div><div style="font-size:12px;color:var(--color-text-muted)">5 logged</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="border: 1px dashed var(--color-border); padding: 24px; text-align: center;">
    <p style="color:var(--color-text-dim); font: 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase;">Tap a tab below to switch sections</p>
  </div>

</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bottom-nav-item active">
      <span class="bn-icon">✦</span>
      <span>Identity</span>
    </button>
    <button class="bottom-nav-item">
      <span class="bn-icon">💼</span>
      <span>Career</span>
    </button>
    <button class="bottom-nav-item">
      <span class="bn-icon">📌</span>
      <span>Situation</span>
    </button>
    <button class="bottom-nav-item">
      <span class="bn-icon">🎯</span>
      <span>Feedback</span>
    </button>
    <button class="bottom-nav-item">
      <span class="bn-icon">⚙</span>
      <span>Account</span>
    </button>
  </div>
</nav>

</body>
</html>
